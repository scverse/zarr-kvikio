name: Release

on:
  release:
    types: [published]

# Use "trusted publishing", see https://docs.pypi.org/trusted-publishers/
permissions: {}

jobs:
  release:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/zarr_kvikio
    permissions:
      contents: read
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false
      - name: Build package
        run: uv build
      - name: Check package
        run: uvx twine check --strict dist/*
      # the installed wheel's entry point loads the pipeline, and zarr works with it installed
      - name: Check entry point
        run: >-
          uv run --isolated --no-project --with dist/*.whl python -c "import importlib.metadata as m, zarr, zarr_kvikio;
          ep = m.entry_points(group='zarr.codec_pipeline')['zarr_kvikio.KvikioCodecPipeline'];
          assert ep.load() is zarr_kvikio.KvikioCodecPipeline;
          zarr.create_array(zarr.storage.MemoryStore(), shape=(1,), dtype='f4')"
      - name: Publish package distributions to PyPI
        # (>= 1.14.3: older ones bundle a twine that rejects hatchling's metadata 2.5)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
