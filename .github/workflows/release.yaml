name: Release

on:
  release:
    types: [published]

# Use "trusted publishing", see https://docs.pypi.org/trusted-publishers/
permissions: {}

jobs:
  release:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/zarr_kvikio
    permissions:
      contents: read
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - name: Build package
        run: uv build
      - name: Check package
        run: uvx twine check --strict dist/*
      # (hatch-vcs reads the version from the tag: a tag it can't read gives a dev version)
      - name: Check the version is the tag's
        run: >-
          uv run --isolated --no-project --with packaging python -c "import glob, sys; from packaging.version import Version;
          built = glob.glob('dist/zarr_kvikio-*.tar.gz')[0][len('dist/zarr_kvikio-'):-len('.tar.gz')];
          sys.exit(f'built {built} from tag {sys.argv[1]}' if Version(built) != Version(sys.argv[1]) else 0)" "$TAG"
        env:
          TAG: ${{ github.ref_name }}
      # the installed wheel's entry point loads the pipeline, and zarr works with it installed
      - name: Check entry point
        run: >-
          uv run --isolated --no-project --with dist/*.whl python -c "import importlib.metadata as m, zarr, zarr_kvikio;
          ep = m.entry_points(group='zarr.codec_pipeline')['zarr_kvikio.KvikioCodecPipeline'];
          assert ep.load() is zarr_kvikio.KvikioCodecPipeline;
          zarr.create_array(zarr.storage.MemoryStore(), shape=(1,), dtype='f4')"
      - name: Publish package distributions to PyPI
        # (>= 1.14.3: older ones bundle a twine that rejects hatchling's metadata 2.5)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
