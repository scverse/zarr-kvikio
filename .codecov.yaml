# Based on pydata/xarray
codecov:
  require_ci_to_pass: no

coverage:
  status:
    project:
      default:
        # Require 1% coverage, i.e., always succeed
        target: 1
    patch: false
    changes: false

# the GPU tests run for pushes to main and labelled pull requests: their coverage is carried forward
flag_management:
  individual_flags:
    - name: gpu
      carryforward: true

comment:
  layout: diff, flags, files
  behavior: once
  require_base: no
