[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "zarr-kvikio"
description = """\
  A zarr-python codec pipeline that reads chunks straight into GPU memory with KvikIO and decodes them with nvCOMP\
  """
readme = "README.md"
license = "MIT"
license-files = [ "LICENSE" ]
maintainers = [ { name = "Severin Dicks", email = "severin.dicks@scverse.org" } ]
authors = [ { name = "Severin Dicks" } ]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: GPU :: NVIDIA CUDA",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dynamic = [ "version" ]
dependencies = [
  "google-crc32c>=1.5",
  # decodes small reads on the CPU (zarr 3.3 needs >= 0.14 too)
  "numcodecs>=0.14",
  "numpy>=1.26",
  # the pipeline subclasses zarr's BatchedCodecPipeline and uses some of its internals
  "zarr>=3.3",
]
# the GPU stack: KvikIO reads, nvCOMP decodes (>= 5.2 for batched decoding into preallocated buffers)
# (CuPy's `ctk` extra brings the CUDA runtime libraries it compiles kernels with, as KvikIO >= 26.8 does)
optional-dependencies.cuda12 = [ "cupy-cuda12x[ctk]>=14.0.1", "kvikio-cu12>=26.4", "nvidia-nvcomp-cu12>=5.2" ]
optional-dependencies.cuda13 = [ "cupy-cuda13x[ctk]>=14.0.1", "kvikio-cu13>=26.4", "nvidia-nvcomp-cu13>=5.2" ]
# Client.register_plugin(..., name=...) is new in 2023.9.2
optional-dependencies.dask = [ "distributed>=2023.9.2" ]
urls.Changelog = "https://zarr-kvikio.readthedocs.io/page/release-notes/index.html"
urls.Documentation = "https://zarr-kvikio.readthedocs.io/"
urls.Homepage = "https://github.com/scverse/zarr-kvikio"
urls.Issues = "https://github.com/scverse/zarr-kvikio/issues"
urls.Source = "https://github.com/scverse/zarr-kvikio"
# lets zarr find the pipeline by name in every process, without importing zarr_kvikio first;
# the guard module keeps zarr working if zarr_kvikio fails to import (e.g. with an untested zarr)
entry-points."zarr.codec_pipeline"."zarr_kvikio.KvikioCodecPipeline" = "_zarr_kvikio_entry:KvikioCodecPipeline"

[dependency-groups]
dev = [ "twine>=4.0.2" ]
test = [ "coverage>=7.10", "distributed", "pytest", "pytest-cov", "zarrs" ]  # (zarrs as the host pipeline)
doc = [
  "ipykernel",
  "ipython",
  "myst-nb>=1.1",
  "scverse-misc[sphinx]>=0.1.2",
  "sphinx>=8.1",
  "sphinx-autodoc-typehints",
  "sphinx-book-theme>=1",
  "sphinx-copybutton",
  "sphinx-design",
  "sphinxcontrib-bibtex>=1",
  "sphinxcontrib-katex",
  "sphinxext-opengraph",
]
typecheck = [ "mypy" ]

[tool.hatch]
version.source = "vcs"
version.raw-options.local_scheme = "no-local-version"
version.raw-options.version_scheme = "guess-next-dev"
build.targets.sdist.include = [ "/src", "/tests", "/LICENSE", "/README.md" ]
build.targets.wheel.only-include = [ "src/_zarr_kvikio_entry.py", "src/zarr_kvikio" ]
build.targets.wheel.sources = [ "src" ]
envs.default.installer = "uv"
envs.default.dependency-groups = [ "dev" ]
envs.docs.features = [ "dask" ]  # documents zarr_kvikio.dask
envs.docs.scripts.build = "sphinx-build -M html docs docs/_build -W {args}"
envs.docs.scripts.clean = "git clean -fdX -- {args:docs}"
envs.docs.scripts.open = "python -m webbrowser -t docs/_build/html/index.html"
envs.docs.dependency-groups = [ "doc" ]
envs.hatch-check-code.dependencies = [ "prek" ]
envs.hatch-check-code.scripts.lint-check = "echo 'try `hatch check code --fix`'; false"
envs.hatch-check-code.scripts.lint-fix = "prek run -a --no-group=format --no-group=typecheck"
envs.hatch-check-fmt.dependencies = [ "prek" ]
envs.hatch-check-fmt.scripts.format-check = "echo 'try `hatch check fmt --fix`'; false"
envs.hatch-check-fmt.scripts.format-fix = "prek run -a --group=format --no-group=typecheck"
envs.hatch-check-types.scripts.check = [ "mypy" ]
envs.hatch-check-types.dependency-groups = [ "typecheck", "test" ]
envs.hatch-test.matrix = [
  # Test the lowest and highest supported Python versions with normal deps
  { deps = [ "stable" ], python = [ "3.12", "3.14" ] },
  # Test the newest supported Python version also with pre-release deps
  { deps = [ "pre" ], python = [ "3.14" ] },
]
# If the matrix variable `deps` is set to "pre",
# set the environment variable `UV_PRERELEASE` to "allow".
envs.hatch-test.overrides.matrix.deps.env-vars = [
  { value = "allow", key = "UV_PRERELEASE", if = [ "pre" ] },
]
envs.hatch-test.dependency-groups = [ "dev", "test" ]

# kvikio-cu12 and -cu13 need different cuda-toolkit majors: resolved together, uv would hold
# kvikio back to a release without that requirement
[tool.uv]
conflicts = [ [ { extra = "cuda12" }, { extra = "cuda13" } ] ]

[tool.ruff]
line-length = 100
src = [ "src" ]
extend-include = [ "*.ipynb" ]
format.docstring-code-format = true
lint.select = [
  "B",   # flake8-bugbear
  "BLE", # flake8-blind-except
  "C4",  # flake8-comprehensions
  "D",   # pydocstyle
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "PTH", # pathlib instead of os.path
  "RUF", # ruff-specific rules
  "SIM", # flake8-simplify
  "TC",  # type-checking blocks
  "TID", # flake8-tidy-imports
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]
lint.ignore = [
  "D100", # missing docstring in public module
  "D104", # missing docstring in public package
  "D105", # missing docstring in magic method
  "D107", # missing docstring in __init__
  "D203", # (conflicts with D211) no blank line before a class docstring
  "D213", # (conflicts with D212) docstrings start right after the opening quotes
  "D401", # first line in imperative mood
]
lint.per-file-ignores."benchmarks/*" = [ "D" ]
lint.per-file-ignores."docs/*" = [ "I" ]
lint.per-file-ignores."tests/*" = [ "D" ]
lint.isort.known-first-party = [ "zarr_kvikio" ]
lint.isort.required-imports = [ "from __future__ import annotations" ]
lint.pydocstyle.convention = "numpy"

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.mypy]
files = [ "src" ]
python_version = "3.12"
warn_redundant_casts = true
warn_unused_ignores = true
enable_error_code = [ "ignore-without-code" ]
warn_unused_configs = true

# dependencies that ship without type information
[[tool.mypy.overrides]]
module = [
  "cupy",
  "distributed",
  "distributed.*",
  "donfig.*",
  "kvikio",
  "kvikio.*",
  "numcodecs",
  "numcodecs.*",
  "nvidia.*",
  "tqdm.*",
  "zarrs",
]
ignore_missing_imports = true

[tool.pytest]
addopts = [
  "--import-mode=importlib", # allow using test files with same name
  "-ra",                     # list the skipped GPU tests
]
strict = true
testpaths = [ "tests" ]

[tool.coverage]
run.source = [ "zarr_kvikio" ]
run.omit = [
  "**/test_*.py",
]
run.patch = [ "subprocess" ]

[tool.cruft]
skip = [
  ".git",
  "tests",
  "src/**/__init__.py",
  "src/**/basic.py",
  "docs/api.md",
  "docs/changelog.md",
  "docs/references.bib",
  "docs/references.md",
  "docs/notebooks/example.ipynb",
]
