[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "zarr-kvikio"
version = "0.1.0.dev0"
description = "A zarr-python codec pipeline that reads chunks straight into GPU memory with KvikIO and decodes them with nvCOMP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
classifiers = [
  "Environment :: GPU :: NVIDIA CUDA",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "google-crc32c",
  "numpy",
  "zarr>=3.3",
]
optional-dependencies.cuda12 = [ "cupy-cuda12x", "kvikio-cu12>=26.4", "nvidia-nvcomp-cu12>=5.2" ]
optional-dependencies.cuda13 = [ "cupy-cuda13x", "kvikio-cu13>=26.4", "nvidia-nvcomp-cu13>=5.2" ]
optional-dependencies.dask = [ "distributed" ]
optional-dependencies.test = [ "distributed", "pytest" ]
entry-points."zarr.codec_pipeline"."zarr_kvikio.KvikioCodecPipeline" = "zarr_kvikio:KvikioCodecPipeline"

[tool.hatch.build.targets.wheel]
packages = [ "src/zarr_kvikio" ]

[tool.pytest.ini_options]
testpaths = [ "tests" ]
addopts = [ "--import-mode=importlib" ]

[tool.ruff]
line-length = 100
lint.select = [ "B", "E", "F", "I", "RUF", "SIM", "UP" ]
