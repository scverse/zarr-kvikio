[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "zarr-kvikio"
description = """\
  A zarr-python codec pipeline that reads chunks straight into GPU memory with KvikIO and decodes them with nvCOMP\
  """
readme = "README.md"
license = "MIT"
license-files = [ "LICENSE" ]
maintainers = [ { name = "Severin Dicks", email = "severin.dicks@scverse.org" } ]
authors = [ { name = "Severin Dicks" } ]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: GPU :: NVIDIA CUDA",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dynamic = [ "version" ]
dependencies = [
  "google-crc32c>=1.5",
  "numpy>=1.26",
  # the pipeline subclasses zarr's BatchedCodecPipeline and uses some of its internals
  "zarr>=3.3",
]
# the GPU stack: KvikIO reads, nvCOMP decodes (>= 5.2 for batched decoding into preallocated buffers)
optional-dependencies.cuda12 = [ "cupy-cuda12x>=13", "kvikio-cu12>=26.4", "nvidia-nvcomp-cu12>=5.2" ]
optional-dependencies.cuda13 = [ "cupy-cuda13x>=13", "kvikio-cu13>=26.4", "nvidia-nvcomp-cu13>=5.2" ]
optional-dependencies.dask = [ "distributed" ]
urls.Changelog = "https://github.com/scverse/zarr-kvikio/blob/main/CHANGELOG.md"
urls.Documentation = "https://github.com/scverse/zarr-kvikio#readme"
urls.Issues = "https://github.com/scverse/zarr-kvikio/issues"
urls.Source = "https://github.com/scverse/zarr-kvikio"
# lets zarr find the pipeline by name in every process, without importing zarr_kvikio first
entry-points."zarr.codec_pipeline"."zarr_kvikio.KvikioCodecPipeline" = "zarr_kvikio:KvikioCodecPipeline"

[dependency-groups]
dev = [ "pre-commit" ]
test = [ "distributed", "pytest", "pytest-cov" ]
typecheck = [ "mypy" ]

[tool.hatch]
version.source = "vcs"
version.raw-options.local_scheme = "no-local-version"
version.raw-options.version_scheme = "guess-next-dev"
build.targets.wheel.packages = [ "src/zarr_kvikio" ]
build.targets.sdist.include = [ "/src", "/tests", "/CHANGELOG.md", "/LICENSE", "/README.md" ]

[tool.ruff]
line-length = 100
src = [ "src" ]
format.docstring-code-format = true
lint.select = [
  "B",   # flake8-bugbear
  "BLE", # flake8-blind-except
  "C4",  # flake8-comprehensions
  "D",   # pydocstyle
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "PTH", # pathlib instead of os.path
  "RUF", # ruff-specific rules
  "SIM", # flake8-simplify
  "TC",  # type-checking blocks
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]
lint.ignore = [
  "D100", # missing docstring in public module
  "D104", # missing docstring in public package
  "D105", # missing docstring in magic method
  "D107", # missing docstring in __init__
  "D203", # (conflicts with D211) no blank line before a class docstring
  "D213", # (conflicts with D212) docstrings start right after the opening quotes
  "D401", # first line in imperative mood
]
lint.per-file-ignores."benchmarks/*" = [ "D" ]
lint.per-file-ignores."tests/*" = [ "D" ]
lint.isort.known-first-party = [ "zarr_kvikio" ]
lint.isort.required-imports = [ "from __future__ import annotations" ]
lint.pydocstyle.convention = "numpy"

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.mypy]
files = [ "src" ]
python_version = "3.12"
warn_redundant_casts = true
warn_unused_ignores = true
enable_error_code = [ "ignore-without-code" ]
warn_unused_configs = true

# dependencies that ship without type information
[[tool.mypy.overrides]]
module = [
  "cupy",
  "cupyx",
  "distributed",
  "distributed.*",
  "donfig.*",
  "kvikio",
  "kvikio.*",
  "numcodecs",
  "numcodecs.*",
  "nvidia.*",
  "tqdm.*",
  "zarrs",
]
ignore_missing_imports = true

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.addopts = [ "--import-mode=importlib", "--strict-markers", "-ra" ]
ini_options.xfail_strict = true

[tool.coverage]
run.source_pkgs = [ "zarr_kvikio" ]
